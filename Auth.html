<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Set the page name, phone layout, and shared sign-up styles. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account - CertiLock</title>
  <link rel="stylesheet" href="Auth.css">
</head>
<body>
  <!-- Show the CertiLock logo above the account form. -->
  <img class="brand-logo" src="image/certilock logo.jpeg" alt="CertiLock — certificate security and verification">
  <h1 class="center">Create an account</h1>
  <!-- Collect the details needed to make a new account. -->
  <form id="register-form">
    <label for="firstname">First Name:</label>
    <input type="text" id="firstname" name="firstname" required><br><br>

    <label for="lastname">Last Name:</label>
    <input type="text" id="lastname" name="lastname" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" minlength="8" required><br><br>

    <button type="submit" id="submit-btn">Register</button>
  </form>
  <!-- Let people with an account go to the sign-in page. -->
  <p class="form-link">Already registered? <a href="Login.html">Log in</a></p>
  
  <!-- This script sends the new account details to Firebase. -->
  <script type="module" src="FirebaseConfig.js"></script>
</body>
</html>
